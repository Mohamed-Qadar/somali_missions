{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Reset Password" %}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white border border-border rounded-2xl p-8 shadow-sm space-y-4">
        <h1 class="text-2xl font-bold text-center">{% trans "Password Reset" %}</h1>
        <p class="text-textSecondary text-sm text-center">
            {% trans "Enter your email address below, and we will email you instructions for setting a new password." %}
        </p>

        <form method="post" class="space-y-4" novalidate>
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-sm font-medium mb-1">{% trans "Email Address" %}</label>
                <input type="email" name="email" id="id_email" required class="w-full rounded-lg border border-border px-3 py-3" />
            </div>
            <button type="submit" class="w-full bg-primary hover:bg-opacity-90 text-white font-bold py-3 rounded-lg shadow-sm">
                {% trans "Send Reset Link" %}
            </button>
        </form>
    </div>
</div>
{% endblock %}
