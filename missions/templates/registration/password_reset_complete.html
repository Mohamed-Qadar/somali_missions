{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Reset Complete" %}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white border border-border rounded-2xl p-8 shadow-sm text-center space-y-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 text-green-700">
            <span class="material-symbols-outlined text-3xl">done</span>
        </div>
        <h1 class="text-2xl font-bold">{% trans "Password Reset Complete" %}</h1>
        <p class="text-textSecondary text-sm">
            {% trans "Your password has been set. You may go ahead and log in now." %}
        </p>
        <a href="{% url 'login' %}" class="block w-full bg-primary hover:bg-opacity-90 text-white font-bold py-3 rounded-lg shadow-sm">
            {% trans "Go to Login" %}
        </a>
    </div>
</div>
{% endblock %}
