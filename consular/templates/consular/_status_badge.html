{% load i18n %}{% spaceless %}
<span class="text-xs font-bold px-2.5 py-0.5 rounded-full border
    {% if status == 'DRAFT' %}bg-slate-100 text-slate-600 border-slate-200
    {% elif status == 'SUBMITTED' %}bg-blue-100 text-blue-700 border-blue-200
    {% elif status == 'UNDER_REVIEW' %}bg-indigo-100 text-indigo-700 border-indigo-200
    {% elif status == 'DOCS_REQUIRED' %}bg-amber-100 text-amber-800 border-amber-200
    {% elif status == 'APPROVED' %}bg-emerald-100 text-emerald-700 border-emerald-200
    {% elif status == 'APPOINTMENT_REQUIRED' %}bg-purple-100 text-purple-700 border-purple-200
    {% elif status == 'COMPLETED' %}bg-green-100 text-green-700 border-green-200
    {% elif status == 'REJECTED' %}bg-red-100 text-red-700 border-red-200
    {% elif status == 'CANCELLED' %}bg-slate-100 text-slate-500 border-slate-200
    {% else %}bg-slate-100 text-slate-600 border-slate-200{% endif %}">
    {{ label }}
</span>
{% endspaceless %}
